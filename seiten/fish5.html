<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisch 5!</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Speech bubble */
    #bubble {
      position: relative;
      display: inline-block;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      margin-bottom: 1.25rem;
      max-width: 100%;
    }
    #bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      translate: -50% 0;
      border: 10px solid transparent;
      border-bottom: 0;
      border-top-color: #e2e8f0;
    }

    #lippenfisch { cursor: pointer; }

    /* Lips flap while the fish talks */
    .card img.talking { animation: flap 0.16s ease-in-out infinite alternate; }
    @keyframes flap {
      from { transform: scale(1, 1); }
      to   { transform: scale(1.04, 0.9) translateY(4px); }
    }

    /* Text-to-Fisch */
    .ttf {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .ttf input {
      flex: 1;
      min-width: 0;
      max-width: 260px;
      font: inherit;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      border: 2px solid #22c55e;
      background: #0f172a;
      color: #e2e8f0;
    }
    .ttf button {
      font: inherit;
      font-weight: 600;
      background: #22c55e;
      color: #0f172a;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      cursor: pointer;
    }
    .ttf button:hover { background: #4ade80; }
    .voice { margin: -0.6rem 0 1.25rem; font-size: 0.85rem; color: #94a3b8; }
    .voice select {
      font: inherit;
      background: #0f172a;
      color: #e2e8f0;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 0.3rem 0.5rem;
      max-width: 100%;
    }
    .voice p { margin: 0.4rem 0 0; font-size: 0.8rem; }

    /* Magische Miesmuschel */
    .muschel {
      margin: 0 0 1.5rem;
      padding: 1.25rem 1rem 1.4rem;
      border: 2px solid #334155;
      border-radius: 12px;
      background: #111c33;
      box-shadow: 0 4px 0 #0b1222;
    }
    .muschel h2 { color: #f0abfc; font-size: 1.4rem; margin-bottom: 0.75rem; }
    .card .muschel img {
      width: 216px;
      max-width: 70%;
      aspect-ratio: auto;
      object-fit: contain;
      image-rendering: pixelated;
      box-shadow: none;
      border-radius: 0;
      margin: 0 auto 0.75rem;
      cursor: pointer;
    }
    .card .muschel img.pull { animation: pull 0.5s ease-in-out; }
    @keyframes pull {
      30% { transform: translateY(10px) rotate(-4deg); }
      60% { transform: translateY(-4px) rotate(2deg); }
    }
    .card .muschel img.talking { animation: hum 0.22s ease-in-out infinite alternate; }
    @keyframes hum { to { transform: rotate(-2deg) scale(1.02); } }
    #answer {
      min-height: 1.6em;
      font-weight: 800;
      font-size: 1.3rem;
      color: #f5d0fe;
      margin-bottom: 0.9rem;
    }
    .muschel .ttf { margin-bottom: 0; }
    .muschel .ttf input { border-color: #e879f9; }
    .muschel .ttf button { background: #e879f9; }
    .muschel .ttf button:hover { background: #f0abfc; }
    @media (max-width: 480px) {
      .muschel .ttf { flex-wrap: wrap; }
      .muschel .ttf input { flex-basis: 100%; max-width: none; }
      .muschel .ttf button { flex: 1; }
    }
  </style>
  <link rel="stylesheet" href="../css/legal.css">
</head>
<body>

  <main class="card">
    <h1>Fisch 5!</h1>
    <div id="bubble" aria-live="polite">Hallo. Ich bin der Lippenfisch. Ich habe Zähne.</div>
    <img id="lippenfisch" src="../img/lippenfisch-spin.gif"
         alt="Drehender Fisch mit dicken Lippen und Menschenzähnen"
         title="Klick mich, ich rede!">
    <form class="ttf" id="ttf">
      <input id="say" type="text" maxlength="200" placeholder="Was soll der Fisch sagen?" aria-label="Was soll der Fisch sagen?">
      <button type="submit">Sprich, Fisch!</button>
    </form>
    <div class="voice">
      <label>Stimme:
        <select id="voice">
          <option value="klar">Fischstimme (verständlich)</option>
          <option value="blub">Fischisch (nur Blub)</option>
        </select>
      </label>
      <p id="voice-hint" hidden>Dein Gerät hat keine deutsche Stimme. Der Fisch spricht deshalb nur Fischisch.</p>
    </div>

    <section class="muschel" aria-label="Magische Miesmuschel">
      <h2>Die magische Miesmuschel</h2>
      <img id="muschel" src="../img/miesmuschel.png"
           alt="Rosa Pixel-Muschel mit einer Zugschnur und einem goldenen Ring"
           title="Stell eine Frage und zieh an der Schnur!">
      <div id="answer" aria-live="polite"></div>
      <form class="ttf" id="ask">
        <input id="question" type="text" maxlength="200" placeholder="Frag die Muschel etwas …" aria-label="Frage an die magische Miesmuschel">
        <button type="submit">An der Schnur ziehen</button>
      </form>
    </section>
    <nav class="links">
      <a href="../index.html">Fisch!</a>
      <a href="fish3.html">Fisch 3!</a>
    </nav>
  </main>

  <script>
    // REVOLUTIONÄR: Der Lippenfisch spricht.
    const fish = document.getElementById('lippenfisch');
    const bubble = document.getElementById('bubble');

    const lines = [
      'Hallo. Ich bin der Lippenfisch. Ich habe Zähne.',
      'Ich habe heute schon dreimal Zähne geputzt. Unter Wasser.',
      'Blub.',
      'Ich bin kein Fisch. Ich bin ein Lebensgefühl.',
      'Hast du Lippenpflege dabei?',
      'Meine Zahnärztin hat Angst vor mir.',
      'Die Pinguine schulden mir noch Geld.',
      'Absolute Odfisch.',
      'Ich rede nur, weil du geklickt hast.',
      'Kuss?'
    ];
    let last = -1;

    // ---- TEXT TO FISCH ---------------------------------------------------
    // Two voices:
    //  * "klar": the browser's own speech synthesis with a German voice that
    //    runs on the device (localService), pitched down so it sounds fishy.
    //    Only on-device voices are used, so the text never leaves the browser.
    //  * "blub": the old fish language. Every letter is a tiny slice of
    //    ../sounds/fish.mp3 ("FISCH!"). Also the fallback without a voice.
    const FISH_VOICE  = { bubble: 'bubble', el: 'lippenfisch', pitch: 0.6, rate: 0.95, blub: 1 };
    const SHELL_VOICE = { bubble: 'answer', el: 'muschel', pitch: 0.1, rate: 0.75, blub: 0.6, clear: true };

    const FI   = { offset: 0.03, dur: 0.10 };
    const SCH  = { offset: 0.19, dur: 0.07 };
    const STEP = 0.068;                       // seconds per letter
    const VOWEL_SEMIS = { a: 0, e: 4, i: 7, o: -3, u: -5, y: 5, 'ä': 2, 'ö': -1, 'ü': -6 };
    const HISS = new Set(['s', 'z', 'c', 'x', 'ß']);
    const synth = window.speechSynthesis || null;
    const voiceHint = document.getElementById('voice-hint');

    let ctx = null, fishBuffer = null, loading = null;
    let playing = [], timers = [], talkingEl = null;

    function germanVoice() {
      if (!synth) return null;
      const local = synth.getVoices().filter(v => v.localService && /^de/i.test(v.lang));
      return local.find(v => /^de[-_]DE/i.test(v.lang)) || local[0] || null;
    }
    function updateHint() {
      voiceHint.hidden = !!germanVoice();
    }
    if (synth) {
      updateHint();
      synth.addEventListener && synth.addEventListener('voiceschanged', updateHint);
    } else voiceHint.hidden = false;

    function loadFish() {
      if (loading) return loading;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return (loading = Promise.resolve(null));
      ctx = new AC();
      loading = fetch('../sounds/fish.mp3')
        .then(r => r.arrayBuffer())
        .then(b => new Promise((ok, fail) => ctx.decodeAudioData(b, ok, fail)))
        .then(buf => (fishBuffer = buf))
        .catch(() => null);
      return loading;
    }

    function grain(t, part, rate, gain) {
      const src = ctx.createBufferSource();
      src.buffer = fishBuffer;
      src.playbackRate.value = rate;
      const g = ctx.createGain();
      const end = t + part.dur / rate;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.008);
      g.gain.linearRampToValueAtTime(0, end);
      src.connect(g).connect(ctx.destination);
      src.start(t, part.offset, part.dur);
      playing.push(src);
    }

    function stopTalking() {
      playing.forEach(s => { try { s.stop(); } catch (e) {} });
      playing = [];
      timers.forEach(clearTimeout);
      timers = [];
      if (synth) synth.cancel();
      if (talkingEl) talkingEl.classList.remove('talking');
    }

    // Plan the fish language: one event per character with its time and sound
    function plan(text, pitch) {
      const base = (0.85 + Math.random() * 0.35) * pitch;
      const asks = /\?\s*$/.test(text);
      const chars = [...text];
      const events = [];
      let t = 0;
      chars.forEach((ch, i) => {
        const c = ch.toLowerCase();
        let sound = null;
        if (/[.!?;:]/.test(c))      { t += STEP * 4; }
        else if (/[,\-–]/.test(c))  { t += STEP * 2; }
        else if (/\s/.test(c))      { t += STEP * 1.3; }
        else if (HISS.has(c))       { sound = { part: SCH, semis: 0, gain: 0.5 }; }
        else if (c in VOWEL_SEMIS)  { sound = { part: FI, semis: VOWEL_SEMIS[c], gain: 0.9 }; }
        else if (/[a-z0-9]/.test(c)){ sound = { part: FI, semis: (c.charCodeAt(0) * 5) % 9 - 4, gain: 0.6 }; }
        if (sound) {
          const rise = asks && i > chars.length - 6 ? (i - (chars.length - 6)) * 2 : 0;
          sound.rate = base * Math.pow(2, (sound.semis + rise) / 12);
        }
        events.push({ at: t, upto: i + 1, sound });
        if (sound) t += STEP;
      });
      return { events, length: t + 0.15 };
    }

    async function speakBlub(text, v, bubble, el) {
      await loadFish();
      if (ctx && ctx.state === 'suspended') await ctx.resume();
      const { events, length } = plan(text, v.blub);
      const chars = [...text];
      const t0 = ctx && fishBuffer ? ctx.currentTime + 0.05 : 0;
      events.forEach(ev => {
        if (ev.sound && fishBuffer) grain(t0 + ev.at, ev.sound.part, ev.sound.rate, ev.sound.gain);
        timers.push(setTimeout(() => { bubble.textContent = chars.slice(0, ev.upto).join(''); }, ev.at * 1000 + 50));
      });
      timers.push(setTimeout(() => {
        bubble.textContent = text;
        el.classList.remove('talking');
      }, length * 1000 + 50));
    }

    function speakClear(text, v, voice, bubble, el) {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.lang = voice.lang;
      u.pitch = v.pitch;
      u.rate = v.rate;
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        bubble.textContent = text;
        el.classList.remove('talking');
      };
      // Show the text word by word as it is spoken
      u.onboundary = e => {
        if (finished) return;
        const rest = text.slice(e.charIndex);
        const len = e.charLength || (rest.match(/^\S*/) || [''])[0].length;
        bubble.textContent = text.slice(0, e.charIndex + len);
      };
      u.onend = done;
      u.onerror = done;
      // Some browsers never fire onend: stop the lips after a generous guess
      timers.push(setTimeout(done, (text.length * 110 / v.rate) + 3000));
      synth.speak(u);
    }

    function speak(text, v) {
      stopTalking();
      const bubble = document.getElementById(v.bubble);
      const el = document.getElementById(v.el);
      bubble.textContent = '';
      el.classList.add('talking');
      talkingEl = el;
      const mode = v.clear ? 'klar' : document.getElementById('voice').value;
      const voice = mode === 'klar' ? germanVoice() : null;
      if (voice) speakClear(text, v, voice, bubble, el);
      else speakBlub(text, v, bubble, el);
    }

    fish.addEventListener('click', () => {
      let i;
      do { i = Math.floor(Math.random() * lines.length); } while (i === last && lines.length > 1);
      last = i;
      speak(lines[i], FISH_VOICE);
    });

    document.getElementById('ttf').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('say');
      const text = input.value.trim();
      if (text) speak(text, FISH_VOICE);
      input.value = '';
    });

    // ---- MAGISCHE MIESMUSCHEL --------------------------------------------
    // Ask a question, pull the string, and the shell answers in a deep voice.
    const shell = document.getElementById('muschel');
    const ANSWERS = [
      'Nein.', 'Nein.', 'Ja.', 'Vielleicht eines Tages.', 'Ich glaube nicht.',
      'Frag später noch einmal.', 'Auf keinen Fall.', 'Gar nichts.',
      'Versuch es noch einmal.', 'Ganz bestimmt.', 'Nur wenn du einen Odfisch fängst.',
      'Frag den Lippenfisch.'
    ];
    let lastAnswer = -1;

    function pull() {
      const text = document.getElementById('question').value.trim();
      let reply = 'Du musst mir schon eine Frage stellen.';
      if (text) {
        let i;
        do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === lastAnswer);
        lastAnswer = i;
        reply = ANSWERS[i];
      }
      stopTalking();
      document.getElementById('answer').textContent = '';
      shell.classList.remove('pull');
      void shell.offsetWidth;                 // restart the animation
      shell.classList.add('pull');
      timers.push(setTimeout(() => {
        shell.classList.remove('pull');
        speak(reply, SHELL_VOICE);
      }, 500));
    }
    shell.addEventListener('click', pull);
    document.getElementById('ask').addEventListener('submit', e => { e.preventDefault(); pull(); });
  </script>

<script src="/js/fish.js" defer></script>
<footer class="legal"><a href="../datenschutz.html">Datenschutz</a></footer>
</body>
</html>
