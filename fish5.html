<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisch 5!</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Speech bubble */
    #bubble {
      position: relative;
      display: inline-block;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      margin-bottom: 1.25rem;
      max-width: 100%;
    }
    #bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      translate: -50% 0;
      border: 10px solid transparent;
      border-bottom: 0;
      border-top-color: #e2e8f0;
    }

    #lippenfisch { cursor: pointer; }

    /* Lips flap while the fish talks */
    .card img.talking { animation: flap 0.16s ease-in-out infinite alternate; }
    @keyframes flap {
      from { transform: scale(1, 1); }
      to   { transform: scale(1.04, 0.9) translateY(4px); }
    }

    /* Text-to-Fisch */
    .ttf {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .ttf input {
      flex: 1;
      min-width: 0;
      max-width: 260px;
      font: inherit;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      border: 2px solid #22c55e;
      background: #0f172a;
      color: #e2e8f0;
    }
    .ttf button {
      font: inherit;
      font-weight: 600;
      background: #22c55e;
      color: #0f172a;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      cursor: pointer;
    }
    .ttf button:hover { background: #4ade80; }
  </style>
  <link rel="stylesheet" href="legal.css">
</head>
<body>

  <main class="card">
    <h1>Fisch 5!</h1>
    <div id="bubble" aria-live="polite">Hallo. Ich bin der Lippenfisch. Ich habe Zähne.</div>
    <img id="lippenfisch" src="lippenfisch-spin.gif"
         alt="Drehender Fisch mit dicken Lippen und Menschenzähnen"
         title="Klick mich, ich rede!">
    <form class="ttf" id="ttf">
      <input id="say" type="text" maxlength="200" placeholder="Was soll der Fisch sagen?" aria-label="Was soll der Fisch sagen?">
      <button type="submit">Sprich, Fisch!</button>
    </form>
    <nav class="links">
      <a href="index.html">Fisch!</a>
      <a href="fish3.html">Fisch 3!</a>
    </nav>
  </main>

  <script>
    // REVOLUTIONÄR: Der Lippenfisch spricht.
    const fish = document.getElementById('lippenfisch');
    const bubble = document.getElementById('bubble');

    const lines = [
      'Hallo. Ich bin der Lippenfisch. Ich habe Zähne.',
      'Ich habe heute schon dreimal Zähne geputzt. Unter Wasser.',
      'Blub.',
      'Ich bin kein Fisch. Ich bin ein Lebensgefühl.',
      'Hast du Lippenpflege dabei?',
      'Meine Zahnärztin hat Angst vor mir.',
      'Die Pinguine schulden mir noch Geld.',
      'Absolute Odfisch.',
      'Ich rede nur, weil du geklickt hast.',
      'Kuss?'
    ];
    let last = -1;

    // ---- FISCH-TTS ------------------------------------------------------
    // Every letter is spoken with a tiny slice of fish.mp3 ("FISCH!"):
    //   0.01–0.17 s is the voiced "Fi", 0.19–0.26 s is the hissy "sch".
    // Vowels and most consonants play a pitched "Fi" grain, s/z/c/x/ß play
    // the "sch" grain, spaces and punctuation are pauses.
    const FI   = { offset: 0.03, dur: 0.10 };
    const SCH  = { offset: 0.19, dur: 0.07 };
    const STEP = 0.068;                       // seconds per letter
    const VOWEL_SEMIS = { a: 0, e: 4, i: 7, o: -3, u: -5, y: 5, 'ä': 2, 'ö': -1, 'ü': -6 };
    const HISS = new Set(['s', 'z', 'c', 'x', 'ß']);

    let ctx = null, fishBuffer = null, loading = null;
    let playing = [], timers = [];

    function loadFish() {
      if (loading) return loading;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return (loading = Promise.resolve(null));
      ctx = new AC();
      loading = fetch('fish.mp3')
        .then(r => r.arrayBuffer())
        .then(b => new Promise((ok, fail) => ctx.decodeAudioData(b, ok, fail)))
        .then(buf => (fishBuffer = buf))
        .catch(() => null);
      return loading;
    }

    function grain(t, part, rate, gain) {
      const src = ctx.createBufferSource();
      src.buffer = fishBuffer;
      src.playbackRate.value = rate;
      const g = ctx.createGain();
      const end = t + part.dur / rate;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.008);
      g.gain.linearRampToValueAtTime(0, end);
      src.connect(g).connect(ctx.destination);
      src.start(t, part.offset, part.dur);
      playing.push(src);
    }

    function stopTalking() {
      playing.forEach(s => { try { s.stop(); } catch (e) {} });
      playing = [];
      timers.forEach(clearTimeout);
      timers = [];
    }

    // Plan the utterance: one event per character with its time and sound
    function plan(text) {
      const base = 0.85 + Math.random() * 0.35;   // every utterance a slightly different fish
      const asks = /\?\s*$/.test(text);
      const chars = [...text];
      const events = [];
      let t = 0;
      chars.forEach((ch, i) => {
        const c = ch.toLowerCase();
        let sound = null;
        if (/[.!?;:]/.test(c))      { t += STEP * 4; }
        else if (/[,\-–]/.test(c))  { t += STEP * 2; }
        else if (/\s/.test(c))      { t += STEP * 1.3; }
        else if (HISS.has(c))       { sound = { part: SCH, semis: 0, gain: 0.5 }; }
        else if (c in VOWEL_SEMIS)  { sound = { part: FI, semis: VOWEL_SEMIS[c], gain: 0.9 }; }
        else if (/[a-z0-9]/.test(c)){ sound = { part: FI, semis: (c.charCodeAt(0) * 5) % 9 - 4, gain: 0.6 }; }
        if (sound) {
          // Questions go up at the end
          const rise = asks && i > chars.length - 6 ? (i - (chars.length - 6)) * 2 : 0;
          sound.rate = base * Math.pow(2, (sound.semis + rise) / 12);
        }
        events.push({ at: t, upto: i + 1, sound });
        if (sound) t += STEP;
      });
      return { events, length: t + 0.15 };
    }

    async function speak(text) {
      stopTalking();
      bubble.textContent = '';
      fish.classList.add('talking');
      await loadFish();
      if (ctx && ctx.state === 'suspended') await ctx.resume();

      const { events, length } = plan(text);
      const chars = [...text];
      const t0 = ctx && fishBuffer ? ctx.currentTime + 0.05 : 0;
      events.forEach(ev => {
        if (ev.sound && fishBuffer) grain(t0 + ev.at, ev.sound.part, ev.sound.rate, ev.sound.gain);
        timers.push(setTimeout(() => { bubble.textContent = chars.slice(0, ev.upto).join(''); }, ev.at * 1000 + 50));
      });
      timers.push(setTimeout(() => {
        bubble.textContent = text;
        fish.classList.remove('talking');
      }, length * 1000 + 50));
    }

    fish.addEventListener('click', () => {
      let i;
      do { i = Math.floor(Math.random() * lines.length); } while (i === last && lines.length > 1);
      last = i;
      speak(lines[i]);
    });

    document.getElementById('ttf').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('say');
      const text = input.value.trim();
      if (text) speak(text);
      input.value = '';
    });
  </script>

<script src="/fish.js" defer></script>
<footer class="legal"><a href="datenschutz.html">Datenschutz</a></footer>
</body>
</html>
